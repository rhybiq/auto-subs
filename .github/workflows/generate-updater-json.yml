name: Generate Updater JSON

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update (e.g. v3.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  compose-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq is available
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download required signatures from release
        id: download-sigs
        run: |
          set -Euo pipefail
          mkdir -p artifacts

          echo "Checking signatures for $TAG..."

          REQUIRED=(
            "rhybiq-windows-x86_64.exe.sig"
          )

          MISSING=0
          for PATTERN in "${REQUIRED[@]}"; do
            echo "Downloading $PATTERN..."
            if ! gh release download "$TAG" --repo "$REPO" --pattern "$PATTERN" --dir artifacts --clobber; then
              echo "  $PATTERN not found in release $TAG"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "⏳ Windows signature not uploaded yet. Exiting cleanly; workflow will re-run when installer lands."
            echo "all_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Windows signature present."
            echo "all_present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose latest.json
        if: steps.download-sigs.outputs.all_present == 'true'
        run: |
          set -Euo pipefail

          WINDOWS_SIG=$(cat artifacts/rhybiq-windows-x86_64.exe.sig)
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json name --jq .name || echo "$TAG")

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "$NOTES" \
            --arg win_sig "$WINDOWS_SIG" \
            --arg tag "$TAG" \
            --arg repo "$REPO" \
            '{
              version: $version,
              pub_date: $pub_date,
              notes: $notes,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: "https://github.com/\($repo)/releases/download/\($tag)/rhybiq-windows-x86_64.exe" }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        if: steps.download-sigs.outputs.all_present == 'true'
        run: |
          set -Euo pipefail
          gh release delete-asset "$TAG" latest.json --repo "$REPO" --yes || echo "No existing latest.json to delete"
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
