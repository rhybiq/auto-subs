name: Package rhybiq for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: D:\ct
    steps:
      - name: Enable Windows long path support
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AutoSubs-App/package-lock.json
            Adobe-Extension/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix Adobe-Extension
          npm ci --prefix AutoSubs-App

      - name: Auto bump version
        shell: bash
        run: |
          set -euo pipefail
          cd AutoSubs-App
          npm run bump-version patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock; then
            git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: auto bump version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Download ffmpeg binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "AutoSubs-App\src-tauri\binaries" | Out-Null
          Set-Location "AutoSubs-App\src-tauri\binaries"

          $zipName = "ffmpeg-x86_64-pc-windows-msvc.zip"
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Attempt ${i}: downloading $zipName from tmoroney/ffmpeg-binaries..."
            gh release download --repo tmoroney/ffmpeg-binaries --pattern $zipName --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $maxAttempts) {
              Write-Error "Failed to download $zipName after $i attempts"
              exit 1
            }
            Start-Sleep -Seconds ($i * 5)
          }

          Expand-Archive -Path $zipName -DestinationPath . -Force
          Remove-Item $zipName
          Remove-Item -Recurse -Force "__MACOSX" -ErrorAction SilentlyContinue

      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Exclude workspace from Windows Defender scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "D:\a" -ErrorAction Stop
          Add-MpPreference -ExclusionProcess "cl.exe" -ErrorAction Stop
          Add-MpPreference -ExclusionProcess "ninja.exe" -ErrorAction Stop

      - name: Build Tauri Windows
        # No TAURI_SIGNING_PRIVATE_KEY secret is configured on this repo, so the
        # updater-signing step after bundling hard-fails even though the NSIS
        # installer itself was already built successfully. Let the job continue;
        # the next step verifies the installer actually exists.
        continue-on-error: true
        shell: pwsh
        env:
          CC: cl
          CXX: cl
          CMAKE_GENERATOR: Ninja
          CFLAGS: /FS
          CXXFLAGS: /FS
          _CL_: /FS
          GGML_CCACHE: "OFF"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Set-Location AutoSubs-App
          npm run tauri build -- -- --no-default-features --features windows

      - name: Collect Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "rhybiq_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path $bundleDir -Filter "rhybiq_*setup.exe" | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Error "No Windows installer found in $bundleDir"
            exit 1
          }

          $sig = Get-ChildItem -Path $bundleDir -Filter "$($installer.Name).sig" | Select-Object -First 1
          $targetInstaller = Join-Path $PWD "rhybiq-windows-x86_64.exe"
          $targetSig = Join-Path $PWD "rhybiq-windows-x86_64.exe.sig"

          Copy-Item -Path $installer.FullName -Destination $targetInstaller -Force
          if ($sig) {
            Copy-Item -Path $sig.FullName -Destination $targetSig -Force
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhybiq-windows
          path: |
            rhybiq-windows-x86_64.exe
            rhybiq-windows-x86_64.exe.sig

      - name: Publish release assets when tagged
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rhybiq-windows-x86_64.exe
            rhybiq-windows-x86_64.exe.sig
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
