name: Package rhybiq for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AutoSubs-App/package-lock.json
            Adobe-Extension/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix Adobe-Extension
          npm ci --prefix AutoSubs-App

      - name: Auto bump version
        shell: bash
        run: |
          set -euo pipefail
          cd AutoSubs-App
          npm run bump-version patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock; then
            git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: auto bump version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build Tauri Windows
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Set-Location AutoSubs-App
          npm run tauri build -- -- --no-default-features --features windows

      - name: Collect Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = Join-Path $PWD "AutoSubs-App/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "rhybiq_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path $bundleDir -Filter "rhybiq_*setup.exe" | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Error "No Windows installer found in $bundleDir"
            exit 1
          }

          $sig = Get-ChildItem -Path $bundleDir -Filter "$($installer.Name).sig" | Select-Object -First 1
          $targetInstaller = Join-Path $PWD "rhybiq-windows-x86_64.exe"
          $targetSig = Join-Path $PWD "rhybiq-windows-x86_64.exe.sig"

          Copy-Item -Path $installer.FullName -Destination $targetInstaller -Force
          if ($sig) {
            Copy-Item -Path $sig.FullName -Destination $targetSig -Force
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhybiq-windows
          path: |
            rhybiq-windows-x86_64.exe
            rhybiq-windows-x86_64.exe.sig

      - name: Publish release assets when tagged
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rhybiq-windows-x86_64.exe
            rhybiq-windows-x86_64.exe.sig
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ github.ref_name }}
